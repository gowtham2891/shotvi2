wami arguing with father and mother", "sheet": {"setup": "Swami works reluctantly at his father's kirana store, sparking a rapid-fire comedic argument about his lack of a job and business ambitions.", "register": "comedy", "self_contained": true, "confidence": 0.95, "thin": true, "beats": [{"t": 396.356, "type": "entry", "line": "L0176", "text": "ఏయ్ అమామ సబ్బులు ఎన్ని ఉన్నాయాడ ఇరవై ఐదు", "note": "Swami's father checks inventory with Swami's mother in the grocery store."}, {"t": 403.376, "type": "setup", "line": "L0178", "text": "ఏందే కందిపప్పు నిన్నటికి, ఏళ్టికి ఇంత తేడా వచ్చేసింది?", "note": "Swami's father complains about missing lentils and low cash box intake."}, {"t": 423.536, "type": "escalation", "line": "L0186", "text": "దాన్నే ముందుచూపు అంటారు.", "note": "Swami arrogantly frames packing lentils ahead of time as 'foresight' (mundu choopu)."}, {"t": 425.576, "type": "escalation", "line": "L0187", "text": "అంత ముందు చూపు ఉంటే జాబ్ ఎందుకు కొట్టలేదా మూడేళ్ల నుంచి.", "note": "Father retorts asking why he couldn't crack a job for three years if he has so much foresight."}, {"t": 442.316, "type": "turn", "line": "L0195", "text": "అయినా నేను ఇంజనీరింగ్ చదివింది జాబ్ కోసం కాదు తెలివితేటల కోసం.", "note": "Swami proclaims he didn't study engineering for a job, but for intellect."}, {"t": 449.216, "type": "escalation", "line": "L0198", "text": "ఏయ్ ఏందిరా నువ్వు మాట్లాడేది ఏంటి మొగోడు పోయితే నా పదిహేను లక్షలు కట్టి మాట్లాడరా.", "note": "Father furiously demands Swami pay back the 15 lakhs spent on his engineering degree."}, {"t": 457.116, "type": "turn", "line": "L0202", "text": "ఆపుతారా, రోజు గోల అయిపోయింది మీతో.", "note": "Mother intervenes to stop their daily shouting match and sends the father away to the godown."}, {"t": 478.936, "type": "payoff", "line": "L0211", "text": "అన్న, తమ్ముడు ఉంటే ఆడితో గొడవ పడేవన్నీ, లేరు కాబట్టి నాన్నతో", "note": "Swami tells his mother he only fights with his dad because he doesn't have brothers to fight with."}, {"t": 486.576, "type": "entry", "line": "L0213", "text": "ఏయ్ బడ్డీ బాయ్ వచ్చేస్తున్నా.", "note": "Surya arrives outside on his bike, calling Swami out."}, {"t": 499.816, "type": "peak", "line": "L0217", "text": "ఇంజనీర్లు ఎప్పుడూ ఒకే చోట ఉండడానికి try చేయకండి.", "note": "Swami excuses himself saying engineers shouldn't stay in one place as it's bad for the country."}], "payoff": {"t": 499.816, "line": "L0217", "text": "ఇంజనీర్లు ఎప్పుడూ ఒకే చోట ఉండడానికి try చేయకండి.", "note": "Swami grandiosely justifies leaving the shop by claiming keeping engineers in one place is harmful to the nation.", "channel": null}, "reaction": {"type": "stare", "by": "H", "note": "Mother stares at Swami in disbelief as he delivers his ridiculous philosophical excuse.", "t": 502.716}, "button": null, "relationship": "Swami and his parents share a comedic, exasperated household dynamic; Surya is his partner in avoiding family responsibilities.", "reveals": "Swami avoids working at the store at any cost, using engineering wit as an excuse to dodge chores.", "context_required": ["Swami is an unemployed B.Tech engineer whose family runs a traditional kirana store.", "Surya and Swami are best friends who meet every morning to avoid family pressure."], "callbacks": ["Unemployed engineering graduates rationalizing their status with inflated philosophical claims."], "delivery": "Rapid-fire banter with classic Telugu domestic sarcasm; the father speaks in an exasperated Rayalaseema/coastal vernacular mix while Swami fires back with deadpan, cheeky replies.", "non_dialogue": [{"start": 401.396, "end": 403.376, "kind": "action_beat", "recommend": "keep", "target_s": null, "reason": "Father walking over and inspecting stock crates establishes shop atmosphere.", "bgm": "ambient store sounds"}, {"start": 413.536, "end": 416.476, "kind": "action_beat", "recommend": "keep", "target_s": null, "reason": "Shows Swami bagging dal ahead of the confrontation.", "bgm": "ambient store sounds"}, {"start": 481.656, "end": 486.576, "k       : `<p class="muted" style="margin-top:12px">Situations, visual beats and hook channels were added to Stage 2 on 2026-10-30; this episode's sheets predate them.</p>`}`;
  el.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { v.currentTime = +c.dataset.t; stopAt = null; v.play().catch(() => {}); }));
}
let cutQueue = null, cutId = null;
function showCands(s) {
  const el = document.getElementById("cands");
  if (!s) { el.innerHTML = ""; return; }
  if (!s.cands.length) { el.innerHTML = `<h2>Stage 3 candidates · scene ${s.id}</h2><p class="muted">${ep.n_cands ? "No candidates in this scene." : "No Stage 3 output yet for this episode (it runs after Stage 2)."}</p>`; return; }
  const span = Math.max(1, s.end - s.start);
  el.innerHTML = `<h2>Stage 3 candidates · scene ${s.id} (${s.cands.length})</h2>
    <p class="muted">Each candidate is a list of time ranges kept from the episode; nothing is cut yet. “Play this cut” plays the kept ranges back to back here, skipping what the cut removes.
    The bar shows what is kept (blue) within the scene.${ep.s4_fresh ? " Stage 4 score shown where scored." : ""}</p>` +
    s.cands.map(c => `<div class="cand" id="cand_${c.id}"><div class="top"><b>${esc(c.id)}</b> <span class="pill">${esc(c.type)}</span><span class="pill">${esc(c.variant)}</span>
      <span>${c.len} s${c.raw !== c.len ? ` (from ${c.raw} s)` : ""}</span>${c.s4 != null ? `<span class="muted">Stage 4 ${c.s4}${c.s4_status !== "pass" ? " · " + esc(c.s4_status) : ""}</span>` : ""}
      ${c.eligible ? "" : '<span class="pill warn">over 180 s</span>'}<button data-id="${c.id}">▶ Play this cut</button></div>
      <div class="mini">${c.segments.map(([a, b]) => `<span style="left:${100 * Math.max(0, a - s.start) / span}%;width:${100 * (b - a) / span}%"></span>`).join("")}</div>
      <div class="muted">${c.segments.length} kept range(s): ${c.segments.map(([a, b]) => fmt(a) + "–" + fmt(b)).join(", ")}
      ${c.n_short + c.n_removed + c.n_skipped + c.n_critic_cut ? ` · cut: ${[c.n_short ? c.n_short + " stretch(es) shortened" : "", c.n_removed ? c.n_removed + " removed" : "", c.n_skipped ? c.n_skipped + " line(s) skipped" : "", c.n_critic_cut ? c.n_critic_cut + " critic trim(s)" : ""].filter(Boolean).join(", ")}` : ""}</div>
      <div class="muted">${esc(c.note)} · start: ${esc(c.start_note)} · end: ${esc(c.end_note)}</div>
      <div>ends on: “${esc(c.button || c.payoff)}”</div></div>`).join("");
  el.querySelectorAll("button[data-id]").forEach(b => b.addEventListener("click", () => playCut(s.cands.find(c => c.id === b.dataset.id))));
}
function playCut(c) {
  document.querySelectorAll(".cand").forEach(x => x.classList.remove("playing"));
  const row = document.getElementById("cand_" + c.id); if (row) row.classList.add("playing");
  cutQueue = c.segments.map(x => x.slice()); cutId = c.id; stopAt = null;
  v.currentTime = cutQueue[0][0]; v.play().catch(() => {});
}
function cutTick() {
  if (!cutQueue || v.seeking) return;                                      // a jump in progress reports the old time
  const t = v.currentTime, seg = cutQueue[0];
  if (t < seg[0] - 1.0 || t > seg[1] + 1.0) { cutQueue = null; return; }           // the viewer moved away: stop following the cut
  if (t >= seg[1] - 0.05) {
    cutQueue.shift();
    if (cutQueue.length) v.currentTime = cutQueue[0][0];
    else { v.pause(); cutQueue = null; }
  }
}
function jump(start, end) { v.currentTime = start; stopAt = stopBox.checked ? end : null; v.play().catch(() => {}); }
function current() { const t = v.currentTime; return ep.scenes.findIndex(s => t >= s.start - 0.05 && t < s.end); }
function tick() {
  if (!ep) return;
  const t = v.currentTime || 0;
  head.style.left = (100 * t / ep.duration) + "%";
  const k = current();
  list.querySelectorAll(".row").forEach(r => r.classList.toggle("on", r.dataset.id !== undefined && k >= 0 && +r.dataset.id === ep.scenes[k].id));
  if (k >= 0) { const s = ep.scenes[k]; now.innerHTML = `<b>Scene ${s.id}</b> · ${fmt(s.start)} – ${fmt(s.end)} · ${esc(s.label)}`;
    if (document.getElementById("follow").checked && shown !== s.id && !v.paused) showSheet(s); }
  else { const g = ep.gaps.find(g => t >= g.start && t < g.end); now.innerHTML = `<b>No scene</b>${g ? " · " + esc(g.where) : ""} · ${fmt(t)}`; }
  if (stopAt !== null && t >= stopAt) { v.pause(); stopAt = null; }
}
bar.addEventListener("click", e => { const r = bar.getBoundingClientRect(); v.currentTime = ep.duration * (e.clientX - r.left) / r.width; stopAt = null; });
v.addEventListener("timeupdate", () => { cutTick(); tick(); });
document.getElementById("prev").addEventListener("click", () => { const t = v.currentTime; const p = [...ep.scenes].reverse().find(s => s.start < t - 1); if (p) jump(p.start, p.end); });
document.getElementById("next").addEventListener("click", () => { const t = v.currentTime; const n = ep.scenes.find(s => s.start > t + 0.1); if (n) jump(n.start, n.end); });
const tabs = document.getElementById("tabs");
DATA.forEach((e, i) => { const b = document.createElement("button"); b.textContent = e.short + " (" + e.scenes.length + " scenes)"; b.onclick = () => load(i); tabs.appendChild(b); });
load(0);
</script>
</body></html>
