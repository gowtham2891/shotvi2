# Cast lists per series (spec 4.1 "Name votes"): one-time input per series. Stage 1A matches these spellings
# (and the names / aka in runs/speaker_fix/<id>.json) against each line's text. Telugu spellings matter: the
# transcript is Telugu script, while speaker_fix names are usually Latin, so add Telugu variants here.
# A series is matched by video id first, then by a case-insensitive regex on the YouTube title.
# genre: comedy | drama | podcast | talking_head (used by the sanity check "a comedy episode has laugh tags").
